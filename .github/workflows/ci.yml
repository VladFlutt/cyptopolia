name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contracts
        working-directory: contracts
        run: |
          npm ci
          forge test
      - name: Artifact is up to date
        working-directory: backend
        run: |
          npm ci
          npm run sync-artifacts
          git diff --exit-code src/artifacts
      - name: Backend
        working-directory: backend
        run: |
          npm run typecheck
          npm test
